services:
  docs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        SENTRY_DSN: ${SENTRY_DSN:-}
        SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-dev}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
        SENTRY_URL: ${SENTRY_URL:-}
        # 由 deplpy 在构建前 export（git rev-parse），非 .env 配置
        GIT_SHA: ${GIT_SHA:-}
        SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    image: ${COMPOSE_IMAGE:-yuce-knowledge-docs:local}
    container_name: ${COMPOSE_CONTAINER_NAME:-yuce-knowledge-docs}
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # 宿主机只读挂载；密钥由 scripts/manage-secrets.sh 在宿主机维护
      # 宿主机 ${DOCS_SECRETS_DIR} → 容器 /opt/secrets；密钥文件名固定 secrets.json
      - ${DOCS_SECRETS_DIR:-/opt/secrets}:/opt/secrets:ro
      # 可观测 JSONL 落盘：宿主机 ${DOCS_OBSERVABILITY_LOG_PATH:-./logs} → 容器 /app/logs
      - ${DOCS_OBSERVABILITY_LOG_PATH:-./logs}:/app/logs
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      DOCS_SECRETS_FILE_PATH: /opt/secrets/secrets.json
      DOCS_OBSERVABILITY_LOG_PATH: /app/logs
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>r.json()).then(j=>process.exit(j.status==='ok'?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # 核心：单容器实现「先启新、后停旧」，消除空窗期
    deploy:
      update_config:
        order: start-first
    stop_grace_period: 15s
