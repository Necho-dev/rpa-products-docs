services:
  docs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    image: yuce-knowledge-sso:local
    container_name: yuce-knowledge-sso
    restart: unless-stopped
    ports:
      # PORT：宿主机映射端口（读项目根 .env）；容器内固定监听 3001
      - "${PORT:-3001}:3001"
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: "0.0.0.0"
    volumes:
      # SSO: 只读挂载宿主机密钥 (与 DOCS_SECRETS_FILE 容器内路径一致, 默认 /opt/secrets/secrets.json)
      # 宿主机文件须对容器用户 nextjs (uid 1001) 可读, 例如 chmod 644 或 chown 1001:1001
      - ${DOCS_SECRETS_HOST_PATH:-/opt/secrets/secrets.json}:/opt/secrets/secrets.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>r.json()).then(j=>process.exit(j.status==='ok'?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # 核心：单容器实现「先启新、后停旧」，消除空窗期
    deploy:
      update_config:
        order: start-first
    stop_grace_period: 15s
